spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  swagger-ui:
    persist-authorization: false
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

app:
  security:
    cookie:
      secure: false
      same-site: Lax

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
